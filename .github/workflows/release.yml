name: Release

# Automates the full release cycle for every merge to main:
#   1. If there are pending changesets, open/update a "Version Packages" PR
#      that bumps package.json and writes the changelog (no publish yet).
#   2. Once that PR is merged (i.e. this workflow runs again on main with no
#      pending changesets left), build, test, and publish to npm, tag the
#      release, and create a GitHub Release — no manual release-cutting
#      step required.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test

      # TEMPORARY DIAGNOSTIC — remove once the E404 publish failure is
      # root-caused. Does not print the token itself.
      # NODE_AUTH_TOKEN is read by the ~/.npmrc that actions/setup-node's
      # registry-url option already wrote earlier in this job.
      - name: Diagnose npm auth and publish access
        run: |
          echo "=== npm CLI version ==="
          npm --version

          echo "=== npm whoami (confirms token identity) ==="
          npm whoami --registry=https://registry.npmjs.org || echo ">>> npm whoami FAILED"

          echo "=== npm config get registry ==="
          npm config get registry

          echo "=== resolved .npmrc (token redacted) ==="
          cat ~/.npmrc | sed -E 's/(_authToken=).*/\1***REDACTED***/'

          echo "=== does @nextrush/log already exist on the registry? ==="
          npm view @nextrush/log versions --registry=https://registry.npmjs.org 2>&1 || echo ">>> npm view FAILED"

          echo "=== can this token see @nextrush/log's access level? ==="
          npm access list packages 0xtanzim --registry=https://registry.npmjs.org 2>&1 || echo ">>> npm access list (by owner) FAILED"

          echo "=== dry-run publish from the built package (no actual publish) ==="
          npm publish --dry-run --access public --loglevel verbose --registry=https://registry.npmjs.org 2>&1 || echo ">>> dry-run publish FAILED"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm release` = `pnpm build && changeset publish` (package.json).
          # changesets/action@v1 expects the input name `publish`, not
          # `publish-script` — that name only applies to the v2 action line.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
